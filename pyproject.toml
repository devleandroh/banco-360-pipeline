[project]
name = "banco360"
version = "1.0.0"
description = "Lakehouse bancário: ingestão, Bronze/Silver/Gold com PySpark, qualidade de dados e Data Warehouse dimensional"
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 140
target-version = "py311"
